<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · ERP Enterprise</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f1f5f9;font:14px system-ui,sans-serif;color:#0f172a}.card{width:min(420px,92vw);background:white;padding:36px;border:1px solid #e2e8f0;border-radius:20px;box-shadow:0 20px 50px #0f172a0a}.logo{display:grid;place-items:center;width:44px;height:44px;background:#4f46e5;color:white;border-radius:14px;font-size:24px;font-weight:700}h1{font-size:24px;margin:22px 0 8px}p{color:#64748b;line-height:1.6}label{display:block;font-weight:600;margin-top:20px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;margin-top:8px;font:inherit}input:focus{outline:2px solid #a5b4fc;border-color:#6366f1}button{width:100%;padding:12px;margin-top:24px;border:0;border-radius:8px;background:#4f46e5;color:white;font:600 14px system-ui;cursor:pointer}button:disabled{opacity:.6}#login-error{color:#be123c;font-size:13px}#login-notice{font-size:13px;color:#166534}.foot{margin-top:22px;font-size:12px;text-align:center}
body{background:radial-gradient(ellipse at 15% 20%,#263e64 0,transparent 55%),#101b30}.card{border-radius:14px;padding:38px;box-shadow:0 30px 90px #0003}.logo{background:#2563eb;border-radius:10px;font-size:19px}h1{letter-spacing:-.035em;font-size:26px}label{font-size:12px;color:#465972}input{font-size:13px;border-color:#d5dfed}button{background:#2563eb;font-size:13px}button:hover{background:#1d4ed8}input:focus{outline:3px solid #dbeafe;border-color:#6594f4}.foot{color:#8291a7;font-size:11px}</style></head><body><main class="card"><div class="logo">E</div><h1>Chào mừng trở lại</h1><p>Đăng nhập để tiếp tục quản lý công việc của bạn.</p><p id="login-notice" role="status"></p>
<form id="login-form"><label for="username">Tên đăng nhập</label><input id="username" name="username" autocomplete="username" required autofocus maxlength="64"><label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" required><p id="login-error" role="alert"></p><button id="login-submit" type="submit">Đăng nhập</button></form><p class="foot">Liên hệ quản trị viên nếu bạn cần được cấp tài khoản.</p></main><script src="login.js?v=2"></script></body></html>
